<!-- =====================================================================
     ADMIN CSS
     ===================================================================== -->
<style>
:root{--primary:#0B3D91;--secondary:#0A1F44;--accent:#19C3E6;--bg:#F3F6FB;--surface:#fff;--text:#0A1A33;--muted:#5B6B85;--border:#E1E8F2;--success:#12B981;--warning:#F59E0B;--danger:#EF4444;--radius:14px;--side:260px;--grad:linear-gradient(135deg,var(--primary),var(--accent));--shadow:0 8px 24px -12px rgba(10,31,68,.18);--font:"Inter",system-ui,sans-serif;--head:"Plus Jakarta Sans","Inter",system-ui,sans-serif;--ar:"Cairo",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14.5px;background:var(--bg);color:var(--text);line-height:1.5}
html[lang="ar"] body,html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:var(--ar)}
h1,h2,h3{font-family:var(--head);margin:0 0 .5em;line-height:1.25}
h1{font-size:1.45rem}h2{font-size:1.1rem}h3{font-size:.98rem}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:.85rem}.ltr{direction:ltr;unicode-bidi:embed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--text);transition:background .15s,border-color .15s,transform .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 85%,#000)}
.btn-grad{background:var(--grad);color:#fff;border:0}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-success{background:var(--success);border-color:var(--success);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:.84rem;border-radius:8px}
.btn-icon{padding:6px;width:34px;height:34px}
.btn[disabled]{opacity:.5;pointer-events:none}
.input,.select,textarea.input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);min-height:38px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.input{min-height:90px;resize:vertical}
.input:disabled,.input[disabled]{background:var(--bg);color:var(--muted);cursor:not-allowed}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
input[type=color].input{padding:3px;width:52px;height:38px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--bg);border:1px solid var(--border);white-space:nowrap}
.b-green{background:#E7F8F0;color:#0E7A52;border-color:#BCEBD5}.b-blue{background:#E8F4FD;color:#0B4A7A;border-color:#BFDDF5}.b-orange{background:#FFF4E5;color:#9A5B00;border-color:#FAD9A8}.b-red{background:#FEECEC;color:#9B1C1C;border-color:#F8C4C4}.b-purple{background:#F1ECFE;color:#5B34C7;border-color:#DCCFFB}.b-gray{color:var(--muted)}
/* Auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 0,color-mix(in srgb,var(--accent) 30%,transparent),transparent 45%),radial-gradient(circle at 0 100%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 45%),var(--bg)}
.auth .card{width:min(420px,100%);padding:30px}
.auth img{height:86px;display:block;margin:0 auto 10px}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:.9rem}
.alert.error{background:#FEECEC;color:#9B1C1C}.alert.ok{background:#E7F8F0;color:#0E7A52}.alert.info{background:#E8F4FD;color:#0B4A7A}.alert.warn{background:#FFF4E5;color:#7A4800}
/* Shell */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--secondary);color:#C9D6EA;padding:14px 10px 30px;scrollbar-width:thin}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;text-decoration:none;color:#C9D6EA}
.sidebar .brand img{height:44px;background:#fff;border-radius:10px;padding:4px}
.sidebar .brand strong{color:#fff;font-family:var(--head)}
.nav-group{margin-top:12px}
.nav-group>span{display:block;padding:6px 12px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#7F93B3;font-weight:700}
html[lang="ar"] .nav-group>span{letter-spacing:0}
.nav-link{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:#C9D6EA;text-decoration:none;font-weight:500}
.nav-link:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-link[aria-current="page"]{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,transparent),transparent);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
html[dir="rtl"] .nav-link[aria-current="page"]{box-shadow:inset -3px 0 0 var(--accent);background:linear-gradient(-90deg,color-mix(in srgb,var(--accent) 30%,transparent),transparent)}
.nav-link .count{margin-inline-start:auto;background:var(--accent);color:#04203A;border-radius:999px;font-size:.7rem;font-weight:800;padding:0 7px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .search{position:relative;flex:1;max-width:520px}
.topbar .search .input{padding-inline-start:36px}
.topbar .search .icon{position:absolute;inset-inline-start:11px;top:10px;color:var(--muted)}
.search-results{position:absolute;top:calc(100% + 6px);inset-inline:0;max-height:420px;overflow:auto;z-index:40;padding:6px}
.search-results a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--text)}
.search-results a:hover,.search-results a:focus{background:var(--bg)}
.topbar .sp{flex:1}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--danger);color:#fff;border-radius:999px;font-size:.68rem;font-weight:800;padding:0 6px;min-width:18px;text-align:center}
.dropdown{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:min(380px,90vw);max-height:480px;overflow:auto;z-index:50;padding:8px}
.notif{display:block;padding:10px;border-radius:10px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--border)}
.notif.unread{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:999px;padding:2px;background:var(--surface)}
.lang-switch button{border:0;background:none;padding:3px 8px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.75rem;color:var(--muted)}
.lang-switch button[aria-pressed="true"]{background:var(--primary);color:#fff}
.content{padding:22px 24px 60px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none}
.mobile-brand{display:none;align-items:center;gap:8px;text-decoration:none;min-width:0}
.mobile-brand img{height:28px;flex:none}
.mobile-brand span{color:var(--secondary);font-weight:800;font-family:var(--head);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.bottom-nav{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
/* Liste */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-width:160px}
.toolbar .grow{flex:1;min-width:200px}
.table-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse}
table.list th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:start;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);position:sticky;top:0}
html[lang="ar"] table.list th{letter-spacing:0}
table.list th button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-transform:inherit}
table.list td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.list tr:hover td{background:#FAFCFF}
table.list td.acts{text-align:end;white-space:nowrap}
.cell-main{font-weight:600}
.thumb{width:44px;height:34px;border-radius:6px;object-fit:cover;background:var(--bg);border:1px solid var(--border)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px;flex-wrap:wrap}
.state{padding:40px 16px;text-align:center;color:var(--muted)}
.state .icon{width:36px;height:36px;margin-bottom:6px;opacity:.6}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD5E1;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:16px;height:16px;top:3px;inset-inline-start:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--success)}
.switch input:checked+span::before{transform:translateX(16px)}
html[dir="rtl"] .switch input:checked+span::before{transform:translateX(-16px)}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
/* Formulaires */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.fld label.lbl{display:block;font-weight:600;font-size:.86rem;margin-bottom:5px}
.fld .help{font-size:.78rem;color:var(--muted);margin-top:4px}
.fld .err{font-size:.8rem;color:var(--danger);margin-top:4px}
.fld.invalid .input{border-color:var(--danger)}
.req{color:var(--danger)}
.lang-tabs{display:inline-flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px}
.lang-tabs button{border:0;background:none;padding:4px 10px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.8rem;color:var(--muted)}
.lang-tabs button[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
form[data-edit-lang="fr"] [data-lang]:not([data-lang="fr"]),form[data-edit-lang="en"] [data-lang]:not([data-lang="en"]),form[data-edit-lang="ar"] [data-lang]:not([data-lang="ar"]){display:none}
.i18n-flag{font-size:.7rem;font-weight:700;color:var(--muted);margin-inline-start:6px}
.img-field{display:flex;gap:8px;align-items:center}
.img-field img{width:54px;height:54px;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:repeating-conic-gradient(#f1f5f9 0 25%,#fff 0 50%) 0 0/12px 12px}
.fieldset{border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.fieldset legend{font-weight:700;padding:0 6px;font-size:.88rem}
/* Modale */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}
.modal .bd{position:absolute;inset:0;background:rgba(10,26,51,.5);backdrop-filter:blur(3px)}
.modal .dlg{position:relative;width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:pop .2s ease-out}
.modal .dlg.wide{width:min(1100px,100%)}.modal .dlg.narrow{width:min(460px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal header h2{margin:0}
.modal .body{padding:18px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toasts{position:fixed;bottom:16px;inset-inline-end:16px;z-index:200;display:grid;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{padding:12px 14px;border-radius:12px;background:var(--surface);box-shadow:0 12px 30px -10px rgba(0,0,0,.3);border-inline-start:4px solid var(--accent);animation:pop .2s}
.toast.success{border-color:var(--success)}.toast.error{border-color:var(--danger)}.toast.warning{border-color:var(--warning)}
/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;text-decoration:none;color:inherit;display:block}
.kpi .n{font-family:var(--head);font-size:1.6rem;font-weight:800}
.kpi .l{color:var(--muted);font-size:.84rem;display:flex;align-items:center;gap:6px}
.kpis-mobile,.cat-hub{display:none}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.menu-back{display:none}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mini-list{list-style:none;margin:0;padding:0}
.mini-list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:center}
.mini-list li:last-child{border-bottom:0}
.chart svg{width:100%;height:auto}
/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.kcol{background:#EDF2F9;border-radius:12px;padding:10px;min-height:200px}
.kcol.over{outline:2px dashed var(--accent)}
.kcol h3{font-size:.82rem;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 2px 6px -2px rgba(0,0,0,.12);cursor:grab;border:1px solid var(--border)}
.kcard select{margin-top:6px;font-size:.8rem;padding:4px;min-height:auto}
/* Inbox */
.inbox{display:grid;grid-template-columns:360px 1fr;gap:14px;min-height:calc(100vh - 190px)}
.inbox-list{overflow:auto;max-height:calc(100vh - 190px)}
.inbox-item{display:block;width:100%;text-align:start;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.inbox-item.unread{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.inbox-item.unread strong::before{content:"● ";color:var(--accent)}
.inbox-item[aria-current="true"]{background:#E8F1FD}
.conv{display:flex;flex-direction:column;min-height:0}
.conv-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);max-height:50vh}
.bubble{max-width:80%;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);white-space:pre-wrap;word-break:break-word}
.bubble.staff{align-self:flex-end;background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.bubble small{display:block;color:var(--muted);font-size:.72rem;margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
/* Éditeur de lignes */
table.items{width:100%;border-collapse:collapse}
table.items th{font-size:.74rem;color:var(--muted);text-align:start;padding:6px;text-transform:uppercase}
table.items td{padding:4px;vertical-align:top}
table.items .input{min-height:34px;padding:6px 8px}
table.items td.num{text-align:end;white-space:nowrap;padding-top:12px;font-weight:600}
.totals{width:min(340px,100%);margin-inline-start:auto}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .grand{border-top:2px solid var(--text);font-weight:800;font-size:1.05rem;margin-top:4px;padding-top:8px}
/* Médias */
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media-item{padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.media-item .pv{aspect-ratio:1;border-radius:10px;background:repeating-conic-gradient(#f1f5f9 0 25%,#fff 0 50%) 0 0/14px 14px;display:grid;place-items:center;overflow:hidden}
.media-item .pv img{width:100%;height:100%;object-fit:contain}
.media-item .nm{font-size:.78rem;word-break:break-all}
.media-item.pick{cursor:pointer}.media-item.pick:hover{outline:2px solid var(--accent)}
/* Éditeur visuel des éléments flottants */
.fe-stage{position:relative;aspect-ratio:1/.95;max-width:620px;margin:10px auto 20px;border:2px dashed var(--border);border-radius:16px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%)}
.fe-stage img.bg{position:absolute;inset:9% 7%;width:86%;height:82%;object-fit:contain;opacity:.55;pointer-events:none}
.fe-box{position:absolute;padding:6px 8px;border-radius:10px;background:var(--surface);border:1.5px solid var(--primary);font-size:.72rem;font-weight:700;cursor:move;touch-action:none;user-select:none;box-shadow:var(--shadow);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.fe-box.inactive{opacity:.4;border-style:dashed}
.fe-box:focus{outline:3px solid var(--accent)}
/* Calendrier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center}
.cal .day{min-height:96px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;font-size:.78rem}
.cal .day.out{opacity:.45}.cal .day.today{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.cal .ev{display:block;width:100%;text-align:start;border:0;border-radius:6px;padding:2px 5px;margin-top:3px;background:#E8F4FD;color:#0B4A7A;cursor:pointer;font-size:.72rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.perm-table td,.perm-table th{text-align:center}.perm-table td:first-child,.perm-table th:first-child{text-align:start}
.color-row{display:flex;align-items:center;gap:8px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.swatches span{width:34px;height:34px;border-radius:8px;border:1px solid var(--border)}
.snippet{font-family:Arial,sans-serif;max-width:600px}
.snippet .t{color:#1a0dab;font-size:1.15rem}.snippet .u{color:#006621;font-size:.85rem}.snippet .d{color:#545454;font-size:.88rem}
.progress{height:7px;border-radius:9px;background:var(--border);overflow:hidden;min-width:80px}
.progress span{display:block;height:100%;background:var(--grad)}
/* Responsive */
@media (max-width:1100px){.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:min(290px,86vw);z-index:90;transform:translateX(-105%);transition:transform .25s}
  html[dir="rtl"] .sidebar{transform:translateX(105%)}
  .sidebar.open{transform:none!important;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .side-bd{position:fixed;inset:0;z-index:80;background:rgba(10,26,51,.45)}
  .menu-btn{display:inline-flex}
  .inbox{grid-template-columns:1fr}
  .inbox.has-current .inbox-list{display:none}
  .grid-2,.grid-3,.grid-main{grid-template-columns:1fr}
  .menu-back{display:inline-flex}
  .content{padding:16px 12px 60px}
  .topbar{padding:8px 12px}
  .topbar .uname{display:none}
}
@media (max-width:720px){
  .form-grid{grid-template-columns:1fr}
  table.list.responsive thead{display:none}
  table.list.responsive tr{display:block;border:1px solid var(--border);border-radius:12px;margin:10px;background:var(--surface)}
  table.list.responsive td{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--border);text-align:end}
  table.list.responsive td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:start}
  table.list.responsive td.acts{justify-content:flex-end}
  table.list.responsive td.acts::before{content:none}
  .toolbar .input{min-width:0;flex:1 1 140px}
  .cal{grid-template-columns:repeat(7,minmax(40px,1fr));overflow-x:auto}
}
/* Application mobile : écrans téléphone (hub par catégories + barre inférieure) */
@media (max-width:760px){
  html,body{overflow-x:hidden}
  .sidebar,.menu-btn,.side-bd{display:none!important}
  .topbar .search,.topbar .lang-switch,.topbar .site-link{display:none}
  .mobile-brand{display:flex}
  .content{padding:14px 12px calc(82px + env(safe-area-inset-bottom))}
  .kpis{display:none}
  .kpis-mobile{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpis-mobile .kpi{padding:12px}
  .kpis-mobile .kpi .n{font-size:1.3rem}
  .cat-hub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .cat-card{padding:16px 14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:92px;transition:transform .15s}
  .cat-card:active{transform:scale(.97)}
  .cat-ic{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center}
  .cat-ic .icon{width:20px;height:20px;stroke:#fff}
  .cat-tt{font-weight:700;font-family:var(--head);font-size:.95rem;color:var(--text)}
  .cat-sub{font-size:.76rem;color:var(--muted)}
  .cat-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .cat-row{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--border);font-weight:600}
  .cat-row:last-child{border-bottom:0}
  .cat-row:active{background:var(--bg)}
  .cat-row-ic{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
  .cat-row-tt{flex:1;min-width:0}
  .cat-row-chev{color:var(--muted);font-size:1.2rem;flex:none}
  .bottom-nav{position:fixed;inset-inline:0;bottom:0;z-index:70;display:flex;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:600;border-radius:10px}
  .bn-item .icon{width:21px;height:21px}
  .bn-item[aria-current="page"]{color:var(--primary)}
  .bn-item[aria-current="page"] .icon{stroke:var(--primary)}
  .input,.select,textarea.input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* Connexion Supabase intégrée à la page : URL du projet + clé PUBLIQUE (publishable) uniquement.

  if (file.size > rules.maxSize) return L(`Fichier trop volumineux (max ${Math.round(rules.maxSize / 1048576)} Mo).|File too large (max ${Math.round(rules.maxSize / 1048576)} MB).|الملف كبير جدًا.`);

}

/** Enregistre les lignes : supprime celles retirées, met à jour / insère les autres. */
async function saveItems(table, parentKey, parentId, original, state) {
  const keep = new Set(state.filter(i => i.id).map(i => i.id));
  const del = original.filter(i => !keep.has(i.id)).map(i => i.id);
  if (del.length) await api(sb.from(table).delete().in('id', del));
  for (const [k, i] of state.entries()) {
    const row = { label: String(i.label).trim().slice(0, 300), description: (i.description || '').trim() || null, quantity: +i.quantity, unit_price: +i.unit_price || 0, discount_pct: +i.discount_pct || 0, sort_order: k + 1 };
    if (table === 'quote_items') row.service_id = i.service_id || null;
    if (i.id) await api(sb.from(table).update(row).eq('id', i.id)); else await api(sb.from(table).insert({ ...row, [parentKey]: parentId }));
  }
}

async function buildSitemap(siteUrl) {
  const base = siteUrl.replace(/\/+$/, '') + '/';
  const [posts, projects, pages, langs] = await Promise.all([
    api(sb.from('blog_posts').select('slug,updated_at,published_at').eq('status', 'published').is('deleted_at', null)),
    api(sb.from('portfolio').select('slug,updated_at').eq('status', 'published').eq('visible', true).is('deleted_at', null)),
    api(sb.from('legal_pages').select('slug,updated_at').eq('visible', true).is('deleted_at', null)),
    sb.from('site_settings').select('value').eq('key', 'languages').maybeSingle()]);
  const enabled = (langs.data && langs.data.value && langs.data.value.enabled) || LANGS;
  const x = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const now = new Date().toISOString().slice(0, 10);
  const entry = (q, lastmod, prio, freq) => {
    const u = (l) => base + (q || l !== 'fr' ? '?' + [q, l !== 'fr' ? 'lang=' + l : ''].filter(Boolean).join('&') : '');
    return `  <url>\n    <loc>${x(u('fr'))}</loc>\n    <lastmod>${(lastmod || now).slice(0, 10)}</lastmod>\n    <changefreq>${freq}</changefreq>\n    <priority>${prio}</priority>\n` +
      enabled.map(l => `    <xhtml:link rel="alternate" hreflang="${l}" href="${x(u(l))}"/>`).join('\n') + `\n    <xhtml:link rel="alternate" hreflang="x-default" href="${x(u('fr'))}"/>\n  </url>`;
  };
  const urls = [entry('', now, '1.0', 'weekly'), ...posts.map(p => entry('post=' + encodeURIComponent(p.slug), p.updated_at, '0.7', 'monthly')), ...projects.map(p => entry('project=' + encodeURIComponent(p.slug), p.updated_at, '0.6', 'monthly')), ...pages.map(p => entry('page=' + encodeURIComponent(p.slug), p.updated_at, '0.3', 'yearly'))];
  return `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:xhtml="http://www.w3.org/1999/xhtml">\n${urls.join('\n')}\n</urlset>\n`;
}

    if (tbl === 'documents' || tbl === 'media') { const byBucket = {}; rows.forEach(r => { (byBucket[r.bucket || (tbl === 'media' ? 'public-assets' : 'documents')] ||= []).push(r.path); }); for (const [b, paths] of Object.entries(byBucket)) { const { error } = await sb.storage.from(b).remove(paths); if (error) throw error; } }

  async function load() {

      body.replaceChildren(rows.length ? h('div', { class: 'table-wrap' }, h('table', { class: 'list responsive' }, h('thead', {}, h('tr', {}, h('th', {}, L('Élément|Item|العنصر')), h('th', {}, L('Supprimé le|Deleted|حُذف في')), h('th', {}, L('Par|By|بواسطة')), h('th', {}))),

          h('td', { class: 'acts' }, w ? h('button', { class: 'btn btn-sm', type: 'button', onclick: async () => { try { await api(sb.from(st.table).update({ deleted_at: null }).eq('id', r.id)); toast(L('Restauré|Restored|تمت الاستعادة'), 'success'); load(); } catch (e) { toast(errText(e), 'error'); } } }, icon('restore'), L('Restaurer|Restore|استعادة')) : null,
            isAdmin() ? h('button', { class: 'btn btn-sm btn-danger', type: 'button', onclick: async () => { if (!await confirmBox(L(`Supprimer définitivement « ${def[2](r)} » ? Cette action est irréversible.|Permanently delete “${def[2](r)}”? This cannot be undone.|حذف «${def[2](r)}» نهائيًا؟ لا يمكن التراجع.`), { danger: true, confirmText: L('Supprimer définitivement|Delete permanently|حذف نهائي') })) return; try { await permDelete(st.table, [r]); toast(L('Supprimé définitivement|Permanently deleted|حُذف نهائيًا'), 'success'); load(); } catch (e) { toast(errText(e), 'error'); } } }, icon('trash')) : null))))))
        : emptyState(L('La corbeille est vide pour ce type.|Trash is empty for this type.|السلة فارغة لهذا النوع.')));
      emptyBtn.hidden = !isAdmin() || !rows.length; emptyBtn.onclick = async () => { if (!await confirmBox(L(`Vider la corbeille « ${st.table} » (${rows.length} éléments) ? Action irréversible.|Empty “${st.table}” trash (${rows.length} items)? Irreversible.|إفراغ السلة؟ لا يمكن التراجع.`), { danger: true, typeWord: 'SUPPRIMER' })) return; try { await permDelete(st.table, rows); toast(L('Corbeille vidée|Trash emptied|تم إفراغ السلة'), 'success'); load(); } catch (e) { toast(errText(e), 'error'); } };
    } catch (e) { body.replaceChildren(errorState(e, load)); }
  }

  return h('div', {}, h('div', { class: 'page-head' }, h('div', {}, h('h1', {}, L('Corbeille|Trash|سلة المحذوفات')), h('p', { class: 'muted small', style: { margin: 0 } }, L('Les éléments supprimés restent ici jusqu’à leur restauration ou suppression définitive (administrateurs uniquement).|Deleted items stay here until restored or permanently deleted (admins only).|تبقى العناصر المحذوفة هنا حتى استعادتها أو حذفها نهائيًا.'))), h('div', { class: 'actions' }, emptyBtn)), h('div', { class: 'toolbar' }, sel, counts), body);

  const F = buildForm([{ key: 'full_name', label: L('Nom complet|Full name|الاسم الكامل'), type: 'text', required: true }, { key: 'phone', label: L('Téléphone|Phone|الهاتف'), type: 'tel' }, { key: 'locale', label: L('Langue préférée|Preferred language|اللغة المفضلة'), type: 'select', required: true, options: LANGS.map(l => [l, LANG_NAMES[l]]) }, { key: 'avatar_url', label: L('Photo|Photo|الصورة'), type: 'image', folder: 'avatars' }], p);
  const save = h('button', { class: 'btn btn-primary', type: 'button', onclick: async () => { if (!F.validate()) return; try { await api(sb.from('profiles').update(F.getData()).eq('id', S.user.id)); Object.assign(S.profile, F.getData()); toast(L('Profil enregistré|Profile saved|تم حفظ الملف'), 'success'); } catch (e) { toast(errText(e), 'error'); } } }, L('Enregistrer|Save|حفظ'));
  const P = buildForm([{ key: 'pw', label: L('Nouveau mot de passe (8 caractères min.)|New password (min. 8)|كلمة مرور جديدة'), type: 'password', required: true, validate: v => v.length >= 8 ? '' : L('8 caractères minimum.|At least 8 characters.|8 أحرف على الأقل.') }, { key: 'pw2', label: L('Confirmer|Confirm|تأكيد'), type: 'password', required: true }], {});
  const pwb = h('button', { class: 'btn', type: 'button', onclick: async () => { if (!P.validate()) return; const d = P.getData(); if (d.pw !== d.pw2) return toast(L('Les mots de passe ne correspondent pas.|Passwords do not match.|كلمتا المرور غير متطابقتين.'), 'error'); const { error } = await sb.auth.updateUser({ password: d.pw }); if (error) return toast(errText(error), 'error'); logEvent('PASSWORD_CHANGE'); toast(L('Mot de passe modifié|Password changed|تم تغيير كلمة المرور'), 'success'); P.form.reset(); } }, icon('key'), L('Changer le mot de passe|Change password|تغيير كلمة المرور'));
  return h('div', {}, h('div', { class: 'page-head' }, h('h1', {}, L('Mon profil|My profile|ملفي')), h('span', { class: 'badge b-purple' }, L(ROLE_L[p.role]))),
    h('div', { class: 'grid-2' }, h('section', { class: 'card pad' }, h('p', { class: 'muted' }, p.email), F.form, h('div', { style: { marginTop: '12px', textAlign: 'end' } }, save)), h('section', { class: 'card pad' }, h('h2', {}, L('Sécurité|Security|الأمان')), P.form, h('div', { style: { marginTop: '12px', textAlign: 'end' } }, pwb))));
};

// ============================== DÉMARRAGE ==============================
(async function init() {
  try { const l = localStorage.getItem('sc_admin_lang'); if (LANGS.includes(l)) S.lang = l; } catch {}
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  if (!CONFIGURED || !window.supabase) {
    $('#app').replaceChildren(h('div', { class: 'auth' }, h('main', { class: 'card' }, h('img', { src: scAsset('assets/logo/logo.png'), alt: 'SaldaeConnect' }), h('h1', { style: { textAlign: 'center' } }, 'Configuration requise'),
      h('p', {}, !window.supabase ? 'La bibliothèque Supabase n’a pas pu être chargée (connexion Internet ?).' : L('Renseignez l’URL du projet Supabase et la clé publique (publishable) en haut du fichier admin.html (window.SC_CONFIG).|Set the Supabase project URL and the public (publishable) key at the top of admin.html (window.SC_CONFIG).|أدخل رابط مشروع Supabase والمفتاح العام (publishable) في أعلى ملف admin.html (window.SC_CONFIG).')),
      h('p', { class: 'small muted' }, 'Ne mettez jamais la clé « service_role » dans un fichier du site.'))));
    return;
  }
  sb.auth.onAuthStateChange((event) => {
    // setTimeout : évite les blocages connus lors d'appels Supabase dans ce callback
    if (event === 'PASSWORD_RECOVERY') { S.recovery = true; setTimeout(() => authView('reset'), 0); }
    if (event === 'SIGNED_OUT' && S.profile) { S.profile = S.user = null; clearInterval(notifTimer); setTimeout(() => authView(), 0); }
  });
  await loadPublicBits();
  if (/type=recovery/.test(location.hash)) { S.recovery = true; }
  await boot();
})();
</script>
